<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    
<title>Memory Match</title>

<link rel="stylesheet" href="memory.css">
</head>

<body>

<div class="topbar">

    <div class="controls-row">

    <input
        id="gameId"
        placeholder="Spill-ID"
    >

    <button id="startBtn">
        Start
    </button>

    <div class="delay-control">

        <span>
            Ventetid:
            <span id="delayValue">3</span>s
        </span>

        <input
            type="range"
            id="delaySlider"
            min="1"
            max="10"
            value="3"
        >

    </div>

</div>

</div>

<h1 id="gameTitle">🎯 Memory Match</h1>

<div id="winner"></div>

<div id="gameBoard"></div>

<script type="module" src="memory.js"></script>

</body>
</html>
