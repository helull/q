<!DOCTYPE html>
<html lang="no">
<head>

<meta charset="UTF-8">

<title>⚽ DuellQuiz</title>

<link rel="stylesheet" href="pingpong.css">

</head>
<body>

<h1>⚽ DuellQuiz</h1>

<div id="login">

    <input
        id="gameId"
        placeholder="Spill-ID">

    <input
        id="userId"
        placeholder="Brukernavn">

    <button id="joinBtn">

        Bli med

    </button>

</div>

<h2 id="status">

Ikke tilkoblet

</h2>

<div id="game">

    <div id="scoreBoard">

        <span id="myScore">

        0

        </span>

        -

        <span id="opponentScore">

        0

        </span>

    </div>

    <div id="selectedQuestion"></div>

    <div class="columns">

        <div>

            <h3>Spørsmål</h3>

            <div id="questions"></div>

        </div>

        <div>

            <h3>Svar</h3>

            <div id="answers"></div>

        </div>

    </div>

</div>

<script type="module" src="pingpong.js"></script>

</body>
</html>
