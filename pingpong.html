<!DOCTYPE html>
<html lang="no">
<head>

<meta charset="UTF-8">

<title>⚽ DuellQuiz</title>

<link rel="stylesheet" href="pingpong.css">

</head>
<body>

<h1>⚽ DuellQuiz  <span id="currentGameInfo"></span> </h1>

<div id="login">

   <input
    id="gameId"
    list="gameList"
    placeholder="Spill-ID">

<datalist id="gameList"></datalist>

    <input
        id="userId"
        placeholder="Brukernavn">

    <button id="joinBtn">

        Registrer

    </button>

    <select id="opponentSelect">

        <option value="">

            Velg motspiller

        </option>

    </select>

    <button id="startGameBtn">

        Start kamp

    </button>

</div>

<h2 id="status">

Ikke tilkoblet

</h2>

<div id="game">

    <div id="scoreBoard">

    <div id="meInfo">
        Meg:
        <strong id="myName"></strong>
        (
        <span id="myScore">0</span>
        )
    </div>

    <div id="opponentInfo">
        Motstander:
        <strong id="opponentName"></strong>
        (
        <span id="opponentScore">0</span>
        )
    </div>

</div>
    <div id="turnInfo"></div>

    <div id="selectedQuestion"></div>

    <div class="columns">

        <div>

            <h3>Spørsmål</h3>

            <div id="questions"></div>

        </div>

        <div>

            <h3>Svar</h3>

            <div id="answers"></div>

        </div>

    </div>

</div>

<script type="module" src="pingpong.js"></script>

</body>
</html>
