<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match-spill</title>

<link rel="stylesheet" href="style.css">

<body>

<div id="topbar">
    <h2>Start spill</h2>

    <input
        type="text"
        id="gameId"
        placeholder="Skriv inn spill-ID">

    <button id="startBtn">
        Start
    </button>
</div>
    
<div class="container">

    <div class="topbar">
    <h1>🎯 Match-spill</h1>
    <div id="timer">⏱ 0 sek</div>
    <button id="restartBtn">Spill på nytt</button>
    </div>

    <div class="game">

        <div class="column">
            <h2>Oppgaver</h2>
            <div id="leftColumn"></div>
        </div>

        <div class="column">
            <h2>Svar</h2>
            <div id="rightColumn"></div>
        </div>

    </div>

    <div id="winner"></div>

</div>

<script type="module" src="script.js"></script>
    
</body>
</html>
