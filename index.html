<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match-spill</title>

<link rel="stylesheet" href="style.css">

<body>

<div class="container">

    <h1>🎯 Match-spill</h1>

    <div class="topbar">
        <div id="timer">Tid: 0 sek</div>
        <button id="restartBtn">Start på nytt</button>
    </div>

    <div class="game">

        <div class="column">
            <h2>Oppgaver</h2>
            <div id="leftColumn"></div>
        </div>

        <div class="column">
            <h2>Svar</h2>
            <div id="rightColumn"></div>
        </div>

    </div>

    <div id="winner"></div>

</div>
    
<script src="script.js"></script>
</body>
</html>
