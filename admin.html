<head>

<body>

<div class="container">

    <h1>📚 Opprett nytt spill</h1>

    <div class="editor-layout">

        <div class="editor-panel">

<div class="top-fields">

    <div>
        <label>Spill-ID</label>
        <input id="gameId"
               placeholder="...som også elevene må velge">
    </div>

    <div>
        <label>Tittel</label>
        <input id="title"
               placeholder="f.eks 'Spansk-gloser, sett 1'">
    </div>

</div>

            <label>Lim inn (KI-)data</label>
            <span>
                Du kan lime inn spørsmål/svar i nesten hvilket som helst format.
                Systemet prøver automatisk å tolke innholdet. Bruk gjerne KI!
            </span>

            <textarea id="sourceText" rows="6" placeholder="Spørsmål|Svar"></textarea>

<div class="button-row">

    <button id="saveBtn">
        Lagre dette spillet
    </button>

    <button
        type="button"
        id="editBtn"
        onclick="location.href='ajour.html'">

        Endre et annet spill

    </button>

</div>

            <div id="status"></div>

        </div>

        <div class="preview-panel">

            <h2>Forhåndsvisning</h2>

            <div id="preview"></div>

        </div>

    </div>

</div>
